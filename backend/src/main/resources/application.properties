# Default config — secrets go in application-local.properties (see application-local.properties.example)

spring.config.import=optional:classpath:application-local.properties

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/shopping_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8080

# AI API keys (set in application-local.properties or environment variables)
gemini.api.key=${GEMINI_API_KEY:}
grok.api.key=${GROK_API_KEY:}
grok.model=${GROK_MODEL:grok-3-mini}

# Admin panel — email that can access /admin.html APIs
app.admin.email=${ADMIN_EMAIL:hassanfarooq565656@gmail.com}

# Upload limits (product images as Base64 in admin)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
server.tomcat.max-http-form-post-size=15MB
server.tomcat.max-swallow-size=15MB
