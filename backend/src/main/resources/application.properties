spring.datasource.url=jdbc:mysql://localhost:3306/shopping_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8080

gemini.api.key=
grok.api.key=
grok.model=grok-3-mini

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
server.tomcat.max-http-form-post-size=15MB
server.tomcat.max-swallow-size=15MB
